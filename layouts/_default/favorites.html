<!DOCTYPE html>
<html lang="ja">
<head>{{ partial "head.html" . }}</head>
<body>
{{ partial "header.html" . }}

<section class="fav-hero">
  <div class="fav-hero-inner" google-side-rail-overlap="false">
    <nav class="breadcrumb" aria-label="パンくずリスト">
      <a href="{{ site.Home.RelPermalink }}">ホーム</a><span class="breadcrumb-sep">›</span><span>お気に入り</span>
    </nav>
    <div class="fav-hero-head">
      <div>
        <span class="search-eyebrow">Favorites</span>
        <h1>お気に入り</h1>
        <p>気になるスポットをこの端末に保存しておけます。お気に入りはお使いのブラウザ内に保存され、サーバーには送信されません。</p>
      </div>
    </div>
  </div>
</section>

<section class="fav-main">
  <div class="fav-toolbar" id="fav-toolbar" hidden>
    <p class="fav-count-text" id="fav-count-text"></p>
    <div class="fav-controls">
      <select id="fav-pref-filter" aria-label="都道府県で絞り込み">
        <option value="all">すべての県</option>
        <option value="広島県">広島県</option>
        <option value="岡山県">岡山県</option>
        <option value="山口県">山口県</option>
        <option value="島根県">島根県</option>
        <option value="鳥取県">鳥取県</option>
      </select>
      <select id="fav-kind-filter" aria-label="カテゴリで絞り込み">
        <option value="all">すべてのカテゴリ</option>
        {{ range $key, $label := site.Params.kindLabel }}
          <option value="{{ $key }}">{{ $label }}</option>
        {{ end }}
      </select>
      <button type="button" class="fav-clear-btn" id="fav-clear-all">すべてクリア</button>
    </div>
  </div>
  <div class="results-grid fav-grid" id="fav-grid" data-index-url="{{ "index.json" | relURL }}" data-search-url="{{ "search/" | relURL }}"></div>
  <p class="empty-note" id="fav-filter-empty" hidden>この条件に一致するお気に入りはありません。</p>
  <div class="fav-empty" id="fav-empty" hidden>
    <p class="fav-empty-title">まだお気に入りがありません</p>
    <p>スポットのカードや詳細ページにあるハートのボタンから追加できます。</p>
    <a class="btn btn--maps" href="{{ "search/" | relURL }}">スポットを探す</a>
  </div>
</section>
{{ partial "footer.html" . }}
</body>
</html>
