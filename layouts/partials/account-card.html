<article class="place-card">
  <h3 class="place-name"><a href="{{ printf "accounts/%s/" .username | relURL }}">{{ .name }}</a></h3>
  <p class="area">@{{ .username }}{{ if .verified }}（認証済み）{{ end }}</p>
  <p class="summary">{{ .note }}</p>
  <p>{{ range .areas }}<span class="tag">{{ . }}</span> {{ end }}{{ range .genres }}<span class="tag">{{ . }}</span> {{ end }}</p>
  <span class="related-meta">フォロワー {{ lang.FormatNumber 0 .followers }}人 ・ 投稿 {{ .posts }}件（{{ .captured_at }} 時点）</span>
  <p class="actions"><a class="btn btn--instagram" href="{{ .url }}" target="_blank" rel="noopener">Instagram で見る</a></p>
</article>
