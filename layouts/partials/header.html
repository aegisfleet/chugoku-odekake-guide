<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PGH23RM8" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="{{ site.Home.RelPermalink }}">
      <span class="brand-mark">{{ partial "icon-pin.html" . }}</span>
      <span><span class="brand-name">{{ site.Title }}</span><span class="brand-sub">広島・岡山・山口・島根・鳥取</span></span>
    </a>
    <button class="menu-toggle" id="menu-toggle" type="button" aria-expanded="false" aria-controls="header-actions" aria-label="メニューを開く">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
    </button>
    <div class="header-actions" id="header-actions">
      <form class="header-search" id="header-search" role="search" action="{{ "search/" | relURL }}" method="get">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14"/></svg>
        <input type="search" name="q" id="header-search-input" placeholder="スポット・市町村・イベント検索" aria-label="スポット・市町村・イベント検索">
      </form>
      <nav class="header-nav">
        <a class="nav-pill{{ if .IsHome }} is-active{{ end }}" href="{{ site.Home.RelPermalink }}">ホーム</a>
        <a class="nav-pill" href="{{ "accounts/" | relURL }}">情報源アカウント</a>
      </nav>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="テーマ（ライト／ダーク）を切り替える">テーマ: 自動</button>
    </div>
    <a class="mobile-search-pill" href="{{ "search/" | relURL }}">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14"/></svg>
      <span>スポット・エリア・#ハッシュタグで検索</span>
      <svg class="pill-tune" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/></svg>
    </a>
  </div>
</header>
{{ $menuJs := resources.Get "js/menu.js" | resources.Fingerprint "sha256" }}
<script src="{{ $menuJs.RelPermalink }}"></script>
{{ if not .IsHome }}<p class="ai-note ai-note--slim">{{ site.Params.aiNote }}</p>{{ end }}
