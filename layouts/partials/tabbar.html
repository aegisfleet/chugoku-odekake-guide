{{/* モバイル用ボトムタブバー（広い画面ではCSSで非表示） */}}
<nav class="tabbar" aria-label="モバイルナビゲーション">
  <a class="tabbar-item{{ if .IsHome }} is-active{{ end }}" href="{{ site.Home.RelPermalink }}">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>ホーム</span>
  </a>
  <a class="tabbar-item{{ if eq .Layout "search" }} is-active{{ end }}" data-tab="search" href="{{ "search/" | relURL }}">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14"/></svg><span>探す・検索</span>
  </a>
  <a class="tabbar-item" data-tab="events" href="{{ "search/" | relURL }}?kind=event">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V10h14v10zM5 8V6h14v2H5z"/></svg><span>イベント</span>
  </a>
  <a class="tabbar-item{{ if in .RelPermalink "/accounts/" }} is-active{{ end }}" href="{{ "accounts/" | relURL }}">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zm7.4-6.9A4 4 0 0 1 17 11.8c1.9-.3 3-1.8 3-3.8a4 4 0 0 0-3.6-4.1zM9 13c-2.3 0-7 1.2-7 3.5V18h14v-1.5C16 14.2 11.3 13 9 13zm8.3-.7c-.2.8-.3 1.5-.3 2.2V18h5v-1.5c0-2-2.4-3.4-4.7-4.2z"/></svg><span>情報源</span>
  </a>
  <button class="tabbar-item" id="tabbar-menu" type="button" aria-label="メニューを開く" aria-expanded="false" aria-controls="header-actions">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg><span>メニュー</span>
  </button>
</nav>
