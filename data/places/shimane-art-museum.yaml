summary: 宍道湖畔に建つ1999年開館の美術館。水との調和をテーマにしたガラス張りの建築で、屋上展望テラスから眺める宍道湖の夕日は「日本の夕陽百選」に選ばれている。北斎の版画コレクションや企画展も見どころで、湖畔の芝生に並ぶ「宍道湖うさぎ」の像も人気。
