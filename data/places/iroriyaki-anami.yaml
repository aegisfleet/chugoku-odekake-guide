summary: 津山市阿波（あば村）の山あいに佇む、完全予約制の囲炉裏焼きレストラン。朝採れの川魚あまごや五平餅を囲炉裏の炭火で焼き、手作りの豆富や地元の米・野菜など、地産地消のコースを味わえる。ミシュランガイド岡山2021ではミシュランプレートに掲載された。同じ建物には1日1組限定の一棟貸し「囲炉裏の宿あなみ」もあり、宿泊者は夜にレストランを貸し切りで利用できる。予約は電話のみ。
