summary: 築120年の古民家を改装した、尾道の丘の上のオーガニックカフェ。尾道近郊のオーガニック野菜を中心に、世界各地の料理を無添加で再構築したランチやスイーツが楽しめる。木の温もりを残したモダンな店内と、庭を望む席が落ち着いた時間を演出する。2026年3月にオープンした。
