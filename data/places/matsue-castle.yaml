summary: 全国に現存する12天守の一つで、天守は国宝に指定された松江のシンボル。宍道湖畔の亀田山に築かれた日本三大湖城の一つで、黒い天守からは湖と城下を一望できる。桜の名所としても知られ、春にはお城まつりが開かれる。
