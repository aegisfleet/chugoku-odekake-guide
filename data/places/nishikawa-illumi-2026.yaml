summary: 岡山市中心部の西川緑道公園を約15万球のLEDが彩る冬のイルミネーション。2026年は公園開設50周年の特別版で、高さ4mのウッドツリーや水上テラスの「LOVE」フォトスポット、旧西川橋交番へのプロジェクションが見どころ。岡山駅から歩いて行ける、入場無料の夜の散歩道。
