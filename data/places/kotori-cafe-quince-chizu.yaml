summary: 芦津渓谷の森の中、山里料理みたき園の敷地内にある木造のカフェ。智頭杉のオブジェや本が並ぶ店内で、湧水で淹れた水出しコーヒーや手作りケーキを味わえる。冬季は休業するため、訪れるのは4月から11月が目安。
