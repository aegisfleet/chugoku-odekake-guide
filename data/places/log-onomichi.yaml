summary: 1963年築の新道アパートをスタジオ・ムンバイが改修した、千光寺へ続く坂の途中の宿。客室は6室のみで、和紙に包まれた空間が特徴。宿泊者以外もカフェ＆バーやギャラリー、庭を楽しめる。宿泊は13歳以上のみで、車では行けず石段を上がる。
