summary: 津山市京町に1927年（昭和2年）から続く老舗のカフェ＆バー。皇太子時代の昭和天皇が行啓したこともある歴史ある空間で、昼は木曜から土曜のカフェ営業として季節のパフェや台湾カステラが親しまれ、夜はバーになる。来年で創業100周年。
