summary: 龍頭山のふもと、森に囲まれた木造の隠れ家カフェ。地元の旬野菜をたっぷり使ったランチは小鉢の多い和の定食で、木のデッキ席から木々を眺めながらゆっくり過ごせる。シフォンケーキなどの手作りスイーツも人気。金・土のみの営業で、ランチは予約が必須。
