summary: 大根島にある池泉回遊式の日本庭園。牡丹と高麗人蔘の里として知られ、秋は紅葉ライトアップで池に映るモミジと和傘の灯りが楽しめる。2026年は11月7日から12月6日に「光の日本庭園 ジパング 2026」を開催中。
