summary: 福山市の瀬戸内海を望む高台にある遊園地。観覧車やゴーカート、実物大の恐竜が動くダイナソーパークなどのアトラクションに加え、昭和の街並みを再現した「いつか来た道」エリアがある。冬はウィンターイルミネーション「キラメキノセカイ」（2026年は11月8日〜2027年1月11日）で夜まで営業し、打上花火の日もある。福山駅から直行バスあり。
