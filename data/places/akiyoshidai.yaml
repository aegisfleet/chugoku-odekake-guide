area: { prefecture: 山口県, label: 美祢市・秋芳町 }
summary: 日本最大のカルスト台地で、日本三大カルストの一つ。白い石灰岩が点在する草原の丘陵が広がり、展望台からは360度のパノラマが楽しめる。地下には秋芳洞をはじめとする鍾乳洞が広がり、2026年には「Mine秋吉台」として世界ジオパークに認定された。
