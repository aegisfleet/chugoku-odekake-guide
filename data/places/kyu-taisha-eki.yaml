name: 旧大社駅
kind: spot
tags: [歴史建築, 鉄道, 重要文化財, レトロ]
area: { prefecture: 島根県, label: 出雲市大社町・北荒木 }
summary: 1924年に建てられた純和風の木造駅舎で、国の重要文化財。1990年の大社線廃止後も駅舎が残り、約5年の保存修理を経て2026年4月に公開を再開した。格天井の待合室や格子窓の切符売り場など大正時代の姿がよみがえり、構内に保存されるD51蒸気機関車や運転シミュレーターも見どころ。出雲大社から神門通りを歩いて約15分の場所にある。
