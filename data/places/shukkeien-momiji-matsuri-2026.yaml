area: { prefecture: 広島県, label: 広島市中区・上幟町 }
summary: 広島市中心部の池泉回遊式の大名庭園で開かれる紅葉まつり。モミジやケヤキなど約140本が色づき、池の水面に映る紅葉が見どころ。夜はライトアップされ、和風カフェ「にわかふぇ」も出店する。11月28日・29日はキッチンカーの「おにわまつり」も開かれる。
