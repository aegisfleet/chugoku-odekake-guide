summary: 日本最大級の海岸砂丘で、国の天然記念物にも指定される鳥取のシンボル。風がつくる砂の稜線「馬の背」は標高約46mの展望スポットで、見晴らしの丘からは日本海まで一望できる。ラクダ乗りや砂のアート体験も楽しめる。
