area: { prefecture: 島根県, label: 安来市・古川町 }
summary: 米国の日本庭園専門誌で23年連続日本一に選ばれた庭園を、館内の大きな窓越しに「生きた額絵」のように眺められる美術館。横山大観の作品を約120点収蔵し、日本画の名品と四季ごとに表情を変える庭園を楽しめる。JR安来駅からシャトルバスで約20分。
