slug: matsue-vogel-park
name: 松江フォーゲルパーク
kind: spot
tags: [花と鳥のテーマパーク, 全天候型, ファミリー]
area: { prefecture: 島根県, label: 松江市・大垣町 }
summary: 宍道湖北岸の丘陵にある、花と鳥の全天候型テーマパーク。1万株以上の花が咲く温室と90種以上の鳥が暮らすエイビアリーがあり、オオハシやハシビロコウへの餌やり、ペンギンのお散歩、フクロウショーなど鳥と間近にふれあえる。雨の日でも楽しめ、展望台からは宍道湖を一望できる。
