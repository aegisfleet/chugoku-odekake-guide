area: { prefecture: 岡山県, label: 倉敷市児島・下の町 }
summary: 国産ジーンズ発祥の地・児島にある、日本最古のジーンズ工場に併設されたミュージアムと体験施設。貴重なヴィンテージジーンズや昔のミシンの展示でデニムの歴史に触れられ、窓越しに職人の縫製作業も見学できる。目玉は自分だけのオリジナルジーンズが作れる体験工房で、生地やボタン、リベット、レザーパッチを選んで職人の手ほどきで仕上げる。
