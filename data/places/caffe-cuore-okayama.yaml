summary: 西川緑道公園沿い、パークサイド3階にある完全予約制のイタリアン。農家直送のオーガニック野菜や地元の食材を使ったおまかせコースに、イタリアワインのペアリングを合わせる。大きな窓から緑道の木々を望む席で、誕生日や記念日の食事にも選ばれている。2025年3月に南区から平和町へ移転。
