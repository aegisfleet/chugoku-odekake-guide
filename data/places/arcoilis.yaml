summary: 広島市安佐南区緑井のシフォンケーキ専門店。店名はスペイン語で「虹」の意味。県北の養鶏農家の卵を使い、膨張剤や保存料を使わずに焼くシフォンケーキは40種類以上の中から日替わりで並び、一番人気は手作りカスタードを生地に練り込んだフレンチカスタード。アンティーク家具に囲まれた店内でイートインもでき、ほぼ全品テイクアウトできる。JR緑井駅から徒歩約3分。
