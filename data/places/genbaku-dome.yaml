slug: genbaku-dome
name: 原爆ドーム
kind: spot
tags: [世界遺産, 平和記念碑, 史跡]
area: { prefecture: 広島県, label: 広島市中区・大手町 }
summary: 1945年8月6日の原子爆弾投下で被爆した旧広島県産業奨励館の残骸を、惨禍を伝える記念碑として保存した場所。1996年にユネスコ世界遺産に登録され、平和記念公園のシンボルとして国内外から多くの人が訪れる。元安川のほとりに佇む鉄骨のドームとレンガの壁が、被爆当時の姿を今に伝える。
