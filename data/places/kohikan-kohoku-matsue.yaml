summary: 宍道湖の北岸、国道沿いに建つツタの絡まる洋館風の喫茶店。アーチ窓の席からは湖面が目の前に広がり、朝の光の中でゆっくり過ごせる。自家焙煎のコーヒーをサイフォンで淹れ、パンにグラタンを詰めて焼いたシシリアンセットやクラブハウスサンドなどの軽食もそろう。地元の老舗が営む店で、全国チェーンの同名店とは別のお店。
