name: 大山まきば みるくの里
kind: spot
tags: [牧場, ソフトクリーム, 白バラ牛乳, 大山, ファミリー]
area: { prefecture: 鳥取県, label: 伯耆町・大山の麓 }
summary: 大山の麓に広がる牧場の中のミルクをテーマにした観光施設。地元で親しまれる白バラ牛乳の世界観でまとめられた館内には公式ショップやレストラン、テイクアウト専門店があり、名物のソフトクリームや大山の食材を使った料理が楽しめる。屋外には牛乳パック型のフォトスポットがあり、放牧地の向こうに大山を望む。
