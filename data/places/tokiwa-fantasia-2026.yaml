summary: ときわ公園の遊園地で開かれる19回目のイルミネーション。約24万個のLEDで彩られ、今年のテーマは「アミューズメント・イルミネーション」。ルーレットを回すと色が変わるツリーや三方向に広がる光のトンネル、園児のイラストによるランタンのタワーなど、遊べる仕掛けと写真スポットが多い。同時開催の「TOKIWAナイトミュージアム2026」も楽しめる。
