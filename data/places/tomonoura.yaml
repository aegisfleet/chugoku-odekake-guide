highlights:
  - 常夜灯（1859年建立の石造灯台、町のシンボル）
  - 江戸時代の港湾施設と町並み（雁木・船番所跡・大波止）
  - 對潮楼（福禅寺客殿、朝鮮通信使を迎えた眺望）
  - 坂本龍馬ゆかりの桝屋清右衛門宅（隠れ部屋）
  - 仙酔島への市営渡船（港から約5分）

