slug: tomonoura
name: 鞆の浦
kind: spot
tags: [港町, 常夜灯, 日本遺産, 歴史的町並み]
area: { prefecture: 広島県, label: 福山市・鞆町 }
summary: 江戸時代の港湾施設と町並みがほぼ当時のまま残る、瀬戸内海の歴史ある港町。1859年に建てられた石造の常夜灯をシンボルに、雁木と呼ばれる石段の船着き場や白壁の町家が港を取り囲む。坂本龍馬ゆかりの桝屋清右衛門宅や、朝鮮通信使を迎えた對潮楼など見どころが多く、映画やアニメの舞台にもなった穏やかな港の風景を求めて、国内外から多くの人が訪れる。
