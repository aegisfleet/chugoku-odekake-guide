summary: 錦川に架かる五連の木造アーチ橋。1673年創建の日本三名橋で、11月中旬から下旬の紅葉の見頃には赤く色づいたモミジ越しの橋がひときわ美しい。渡った先の吉香公園・紅葉谷公園とあわせて巡るのが定番。
