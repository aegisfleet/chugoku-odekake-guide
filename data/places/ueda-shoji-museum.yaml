summary: 世界的な写真家・植田正治の作品約1万2000点を収蔵する個人美術館。建築家・高松伸が設計したコンクリートの建物と、大山を映す水面や「逆さ大山」を望む仕掛けが見どころで、館内では植田の代表作にならった演出写真も楽しめる。
