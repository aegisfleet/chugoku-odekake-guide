highlights:
  - 黒い下見板張りの天守「烏城」の外観
  - 天守最上階からの旭川・市街地の眺め
  - 金鯱（金のシャチホコ）の屋根飾り
  - 天守内部の甲冑・大名道具などの展示
  - 月見櫓・石垣など城郭の遺構めぐり
  - 夜間ライトアップ「烏城灯源郷」（季節限定）

