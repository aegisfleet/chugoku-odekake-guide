summary: 宇喜多秀家が築いた、黒い下見板張りの天守で知られる「烏城」。1966年に復元された天守は内部が展示施設となり、金鯱や甲冑、城主の間の再現展示と、最上階からの旭川・市街地の眺めを楽しめる。旭川を挟んで後楽園と向き合う岡山観光の中心で、秋の夜間ライトアップ「烏城灯源郷」でも知られる。
