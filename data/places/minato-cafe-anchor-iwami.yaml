summary: 浦富海岸の遊覧船乗り場の隣にある海辺のカフェ。看板は黒いバンズのホタルイカバーガーで、鳥取砂丘らっきょうのタルタルソースを合わせる。岩美の海の色をイメージした「岩美ブルーサイダー」や地元精肉店とコラボしたミンチカツバーガー、海老のビスクもある。遊覧船の待ち時間にも利用できる立地。
