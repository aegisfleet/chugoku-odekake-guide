summary: 徳山駅前一帯が約100万球のLEDで彩られる、42回目を迎える周南の冬の風物詩。「日本夜景遺産」にも認定されている。御幸通りや青空公園、駅前ロータリーなどに光のキャンドルや光のトンネルが並び、週末にはサンタのお菓子配りやキッチンカーも。12月19日のファンタジックナイトでは御幸通りが歩行者天国になり、ステージイベントやクリスマスマーケットが開かれる。コンビナート企業の照明が全点灯する日は、工場夜景も一緒に楽しめる。
