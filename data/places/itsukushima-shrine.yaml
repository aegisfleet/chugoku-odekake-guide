summary: 海上に浮かぶ朱塗りの大鳥居と社殿で知られる、宮島のシンボル。1996年にユネスコ世界遺産に登録された安芸国一宮で、干潮時には大鳥居のそばまで歩いて近づける。朱塗りの回廊や宝物館とあわせてめぐりたい。
