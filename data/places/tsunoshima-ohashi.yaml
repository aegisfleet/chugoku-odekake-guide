summary: 本州と角島を結ぶ全長1,780mの海上橋。2000年に開通し、通行は無料。エメラルドグリーンの海に架かる姿はCMやドラマのロケ地としても知られる。橋を眺めるなら本州側の海士ヶ瀬公園や角島側の瀬崎陽の公園が定番で、強風時は通行止めになる場合がある。
