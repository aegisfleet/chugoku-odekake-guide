name: 岡山後楽園
kind: spot
tags: [日本庭園, 日本三名園, 観光名所]
area: { prefecture: 岡山県, label: 岡山市北区・後楽園 }
summary: 日本三名園の一つに数えられる、江戸時代初期に岡山藩主・池田綱政が作庭を命じた大名庭園。約13万平方メートルの広大な園内に池や築山、茶室が配され、旭川の対岸にそびえる岡山城を借景に眺められる。季節の夜間特別開園「幻想庭園」ではライトアップされた幻想的な姿も楽しめる、岡山観光の中心地。
