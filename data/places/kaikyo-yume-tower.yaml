summary: 関門海峡を見渡す高さ153mのタワー。最上階のガラス張りの展望室からは関門海峡と下関の街並みを360度見渡せ、夜はライトアップされた夜景と観覧車の明かりが楽しめる。恋人の聖地にも選ばれている。
