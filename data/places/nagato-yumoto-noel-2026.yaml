summary: 約600年の歴史をもつ長門湯本温泉の温泉街で開かれるクリスマスイベント。恩湯広場に立つ高さ6メートルの本物のもみの木のツリーを中心に、期間中毎晩、日没から22時まで光の演出が行われる。週末の夜は宿や店で生演奏があり、土曜の夜には焚き火も。ポップアップストアや屋台・キッチンカーも並び、湯あがりの散策が楽しめる。
