summary: しまなみ海道の本州側起点、尾道の海沿いに建つ元県営倉庫を改装した複合施設。自転車を部屋まで持ち込めるホテル「HOTEL CYCLE」を中心に、レストラン、カフェ、ベーカリー、サイクルショップなどが一つの建物に集まる。サイクリングの出発点としてだけでなく、海沿いの散策やカフェ利用でも訪れる人が多い。
