summary: 鳥取駅から徒歩約5分の角地、ゲストハウス「Y Pub&Hostel」の1階にある食堂＆パブ。看板の鳥取牛丼は鳥取牛をフライパンで香ばしく焼き上げた一杯で、酒津の塩さば定食や肉ニラうどんなど地元食材のメニューも並ぶ。昼はランチ、夜はお酒とおつまみを楽しめ、店内の卓球台やアヒルのマスコットが旅人と地元の人の交流を生む、気軽な立ち寄りスポット。
